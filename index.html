<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    J223 四期推廣 THI 報帳
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #f5f6f8;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: #252525;

    }


    .page {

      max-width: 980px;

      margin: auto;

      padding: 24px 16px 60px;

    }


    h1 {

      margin:
        0 0 24px;

      font-size: 28px;

    }


    h2 {

      margin:
        0 0 18px;

      font-size: 21px;

    }


    h3 {

      margin:
        28px 0 12px;

      font-size: 17px;

    }


    .card {

      background: white;

      border-radius: 16px;

      padding: 22px;

      margin-bottom: 18px;

      box-shadow:
        0 2px 12px
        rgba(0,0,0,.06);

    }


    /* ========================
       人員
    ======================== */

    .people {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

    }


    .person-btn {

      border:
        1px solid #d5d9df;

      background: white;

      padding:
        10px 18px;

      border-radius: 24px;

      cursor: pointer;

      font-size: 15px;

    }


    .person-btn.active {

      background: #222;

      color: white;

      border-color: #222;

    }


    /* ========================
       其他人員
    ======================== */

    .other-box {

      margin-top: 16px;

    }


    .other-box label {

      display: block;

      font-size: 14px;

      font-weight: 700;

      margin-bottom: 7px;

    }


    .other-box input {

      width: 100%;

      border:
        1px solid #d5d9df;

      border-radius: 9px;

      padding:
        12px 13px;

      font-size: 16px;

    }


    /* ========================
       按鈕
    ======================== */

    .actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

      margin-top: 20px;

    }


    .action-btn {

      border: 0;

      border-radius: 10px;

      padding: 14px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

    }


    .action-btn:disabled {

      opacity: .35;

      cursor: not-allowed;

    }


    .report-btn {

      background: #2367d1;

      color: white;

    }


    .query-btn {

      background: #202124;

      color: white;

    }


    .all-query-btn {

      width: 100%;

      margin-top: 12px;

      background: #e9edf3;

      color: #202124;

    }


    /* ========================
       總覽
    ======================== */

    .person-title {

      font-size: 16px;

      color: #666;

    }


    .grand-total {

      font-size: 42px;

      font-weight: 800;

      margin:
        8px 0 20px;

    }


    .summary-grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

    }


    .summary-box {

      background: #f6f7f9;

      border-radius: 12px;

      padding: 16px;

    }


    .summary-label {

      color: #666;

      font-size: 14px;

    }


    .summary-money {

      font-size: 22px;

      font-weight: 700;

      margin-top: 5px;

    }


    /* ========================
       表格
    ======================== */

    .table-wrap {

      width: 100%;

      overflow-x: auto;

    }


    table {

      width: 100%;

      border-collapse: collapse;

      min-width: 560px;

    }


    th {

      text-align: left;

      color: #666;

      font-size: 13px;

      padding:
        11px 9px;

      border-bottom:
        2px solid #e9eaec;

      white-space: nowrap;

    }


    td {

      padding:
        11px 9px;

      border-bottom:
        1px solid #eceef0;

      vertical-align: top;

    }


    .money {

      text-align: right;

      white-space: nowrap;

    }


    .subtotal-row {

      background: #f6f7f9;

      font-weight: 700;

    }


    .total-row {

      background: #e9edf3;

      font-weight: 800;

    }


    .all-person {

      font-weight: 700;

    }


    .detail-category {

      display: block;

      font-size: 12px;

      color: #777;

      margin-top: 3px;

    }


    /* ========================
       狀態
    ======================== */

    .hidden {

      display: none !important;

    }


    .loading {

      text-align: center;

      padding: 30px;

      color: #666;

    }


    .error {

      color: #b3261e;

      margin-top: 14px;

      font-size: 14px;

    }


    .no-data {

      text-align: center;

      color: #777;

      padding: 18px 0;

    }


    /* ========================
       手機
    ======================== */

    @media(
      max-width: 600px
    ) {

      .page {

        padding:
          16px 10px 40px;

      }


      .card {

        padding: 18px;

      }


      h1 {

        font-size: 23px;

      }


      h2 {

        font-size: 20px;

      }


      .grand-total {

        font-size: 34px;

      }


      .person-btn {

        flex:
          1 1
          calc(33.333% - 10px);

        text-align: center;

        padding:
          10px 7px;

      }


      .actions {

        grid-template-columns:
          1fr 1fr;

      }


      .summary-grid {

        grid-template-columns:
          1fr 1fr;

      }


      /* 不左右滑 */

      .table-wrap {

        overflow-x: visible;

      }


      table {

        width: 100%;

        min-width: 0;

        table-layout: fixed;

      }


      th,
      td {

        padding:
          9px 5px;

        font-size: 13px;

        overflow-wrap: anywhere;

      }


      /* 人員總覽 */

      #peopleSummaryTable
      td:nth-child(1) {

        width: 22%;

      }


      #peopleSummaryTable
      td:nth-child(2),

      #peopleSummaryTable
      td:nth-child(3),

      #peopleSummaryTable
      td:nth-child(4) {

        width: 26%;

      }


      /* 請款 */

      #claimDetailTable
      td:nth-child(1) {

        width: 24%;

      }


      #claimDetailTable
      td:nth-child(2) {

        width: 24%;

        white-space: nowrap;

      }


      #claimDetailTable
      td:nth-child(3) {

        width: 32%;

      }


      #claimDetailTable
      td:nth-child(4) {

        width: 20%;

        white-space: nowrap;

      }


      /* 全部模式請款 */

      #claimDetailTable.all-mode
      td:nth-child(1) {

        width: 23%;

      }


      #claimDetailTable.all-mode
      td:nth-child(2) {

        width: 24%;

      }


      #claimDetailTable.all-mode
      td:nth-child(3) {

        width: 33%;

      }


      #claimDetailTable.all-mode
      td:nth-child(4) {

        width: 20%;

      }


      /* 交通 */

      #transportTable
      td:nth-child(1) {

        width: 36%;

      }


      #transportTable
      td:nth-child(2) {

        width: 36%;

        white-space: nowrap;

      }


      #transportTable
      td:nth-child(3) {

        width: 28%;

        white-space: nowrap;

      }


      /* 膳食 */

      #mealTable
      td:nth-child(1) {

        width: 30%;

        white-space: nowrap;

      }


      #mealTable
      td:nth-child(2) {

        width: 43%;

      }


      #mealTable
      td:nth-child(3) {

        width: 27%;

        white-space: nowrap;

      }

    }

  </style>

</head>


<body>

<script>


/* ===============================
   Apps Script
================================ */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwhraePH7uhX9-ictyBJopLwROQfUwGNjgFNu9CMcTgAnAXrM7cugxkiweiD8J9oRw-/exec';



/* ===============================
   Google Form
================================ */

const FORM_URL =
  'https://docs.google.com/forms/d/e/1FAIpQLSeKTqrh-MGau75CZD2nvh5_JifVz2cSDYBMq-uaw1HQ5LWAnw/viewform';


const PERSON_ENTRY_ID =
  'entry.1521537933';



let selectedPerson = '';

let selectedIsOther = false;



/* ===============================
   人員選擇
================================ */

document
  .querySelectorAll(
    '.person-btn'
  )
  .forEach(button => {


    button.addEventListener(
      'click',
      function () {


        document
          .querySelectorAll(
            '.person-btn'
          )
          .forEach(btn => {

            btn.classList
              .remove(
                'active'
              );

          });


        this.classList
          .add(
            'active'
          );


        const name =
          this.dataset.name;


        selectedIsOther =
          name === '其他';


        const otherBox =
          document
            .getElementById(
              'otherBox'
            );


        if (
          selectedIsOther
        ) {

          otherBox
            .classList
            .remove(
              'hidden'
            );


          selectedPerson =
            document
              .getElementById(
                'otherPerson'
              )
              .value
              .trim();

        }

        else {

          otherBox
            .classList
            .add(
              'hidden'
            );


          selectedPerson =
            name;

        }


        updateButtons();


        document
          .getElementById(
            'topError'
          )
          .textContent = '';

      }
    );

  });



document
  .getElementById(
    'otherPerson'
  )
  .addEventListener(
    'input',
    function () {

      if (
        selectedIsOther
      ) {

        selectedPerson =
          this.value
            .trim();


        updateButtons();

      }

    }
  );



function updateButtons() {

  const enabled =
    !!selectedPerson;


  document
    .getElementById(
      'reportBtn'
    )
    .disabled =
      !enabled;


  document
    .getElementById(
      'queryBtn'
    )
    .disabled =
      !enabled;

}



/* ===============================
   我要報帳
================================ */

document
  .getElementById(
    'reportBtn'
  )
  .addEventListener(
    'click',
    function () {


      if (
        !selectedPerson
      ) {

        showTopError(
          '請先選擇或輸入同仁姓名'
        );

        return;

      }


      let prefilledUrl;


      /*
       * 固定選項
       */
      if (
        !selectedIsOther
      ) {

        prefilledUrl =
          FORM_URL
          + '?usp=pp_url'
          + '&'
          + PERSON_ENTRY_ID
          + '='
          + encodeURIComponent(
              selectedPerson
            );

      }


      /*
       * Google Form
       * 內建「其他」
       */
      else {

        prefilledUrl =
          FORM_URL
          + '?usp=pp_url'
          + '&'
          + PERSON_ENTRY_ID
          + '=__other_option__'
          + '&'
          + PERSON_ENTRY_ID
          + '.other_option_response='
          + encodeURIComponent(
              selectedPerson
            );

      }


      window.open(
        prefilledUrl,
        '_blank'
      );

    }
  );



/* ===============================
   查單人
================================ */

document
  .getElementById(
    'queryBtn'
  )
  .addEventListener(
    'click',
    function () {


      if (
        !selectedPerson
      ) {

        showTopError(
          '請先選擇或輸入同仁姓名'
        );

        return;

      }


      queryExpense(
        selectedPerson
      );

    }
  );



/* ===============================
   查全部
================================ */

document
  .getElementById(
    'allQueryBtn'
  )
  .addEventListener(
    'click',
    function () {

      queryExpense(
        '全部'
      );

    }
  );



/* ===============================
   JSONP
================================ */

function queryExpense(name) {


  showLoading();


  const callbackName =
    'expenseCallback_'
    + Date.now();


  const script =
    document.createElement(
      'script'
    );


  const timeout =
    setTimeout(
      function () {

        cleanup();

        showError(
          '資料讀取逾時，請稍後再試'
        );

      },

      15000
    );


  window[
    callbackName
  ] =
    function (data) {


      clearTimeout(
        timeout
      );


      cleanup();


      if (
        !data ||
        data.success !== true
      ) {

        showError(
          data &&
          data.message
            ? data.message
            : '查詢失敗'
        );

        return;

      }


      renderResult(
        data
      );

    };


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    delete window[
      callbackName
    ];

  }


  script.src =
    API_URL
    + '?action=query'
    + '&name='
    + encodeURIComponent(
        name
      )
    + '&callback='
    + encodeURIComponent(
        callbackName
      );


  script.onerror =
    function () {


      clearTimeout(
        timeout
      );


      cleanup();


      showError(
        '無法連線至報帳資料'
      );

    };


  document.body
    .appendChild(
      script
    );

}



/* ===============================
   顯示結果
================================ */

function renderResult(data) {


  const isAll =
    data.mode === 'all';


  document
    .getElementById(
      'loading'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'result'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'personTitle'
    )
    .textContent =
      isAll
        ? '全部同仁｜本次活動'
        : data.person
          + '｜本次活動';


  document
    .getElementById(
      'grandTotal'
    )
    .textContent =
      '$'
      + money(
          data.grandTotal
        );


  document
    .getElementById(
      'claimTotalTop'
    )
    .textContent =
      '$'
      + money(
          data.summary
            .claimTotal
        );


  document
    .getElementById(
      'travelTotalTop'
    )
    .textContent =
      '$'
      + money(
          data.summary
            .travelTotal
        );


  renderPeopleSummary(
    data
  );


  renderClaimSummary(
    data
  );


  renderTravelSummary(
    data
  );


  renderClaimDetail(
    data
  );


  renderTransport(
    data
  );


  renderMeal(
    data
  );


  document
    .getElementById(
      'result'
    )
    .scrollIntoView({

      behavior:
        'smooth',

      block:
        'start'

    });

}



/* ===============================
   全部人員總覽
================================ */

function renderPeopleSummary(
  data
) {


  const card =
    document
      .getElementById(
        'peopleSummaryCard'
      );


  if (
    data.mode !== 'all'
  ) {

    card
      .classList
      .add(
        'hidden'
      );

    return;

  }


  card
    .classList
    .remove(
      'hidden'
    );


  let html = '';


  data.people
    .forEach(person => {


      html += `

        <tr>

          <td class="all-person">
            ${escapeHtml(
              person.name
            )}
          </td>

          <td class="money">
            $${money(
              person.claimTotal
            )}
          </td>

          <td class="money">
            $${money(
              person.travelTotal
            )}
          </td>

          <td class="money">
            $${money(
              person.total
            )}
          </td>

        </tr>

      `;

    });


  html += `

    <tr class="total-row">

      <td>
        全部合計
      </td>

      <td class="money">
        $${money(
          data.summary
            .claimTotal
        )}
      </td>

      <td class="money">
        $${money(
          data.summary
            .travelTotal
        )}
      </td>

      <td class="money">
        $${money(
          data.grandTotal
        )}
      </td>

    </tr>

  `;


  document
    .getElementById(
      'peopleSummaryTable'
    )
    .innerHTML =
      html;

}



/* ===============================
   請款分類
================================ */

function renderClaimSummary(
  data
) {


  let html = '';


  data.claim.groups
    .forEach(group => {


      html += `

        <tr>

          <td>
            ${escapeHtml(
              group.category
            )}

function renderClaimDetail(
  data
) {


  const isAll =
    data.mode === 'all';


  const tbody =
    document
      .getElementById(
        'claimDetailTable'
      );


  if (isAll) {

    tbody
      .classList
      .add(
        'all-mode'
      );

  }

  else {

    tbody
      .classList
      .remove(
        'all-mode'
      );

  }


  let html = '';

  let hasData = false;


  data.claim.groups
    .forEach(group => {


      if (
        !group.items ||
        group.items.length === 0
      ) {

        return;

      }


      hasData = true;


      group.items
        .forEach(item => {


          const firstCell =
            isAll
              ? `
                <strong>
                  ${escapeHtml(
                    item.person
                  )}

                <span class="detail-category">
                  ${escapeHtml(
                    group.category
                  )}

              `
              : escapeHtml(
                  group.category
                );


          html += `

            <tr>

              <td>
                ${firstCell}
              </td>

              <td>
                ${escapeHtml(
                  item.date
                )}
              </td>

              <td>
                ${escapeHtml(
                  item.description
                )}
              </td>

              <td class="money">
                $${money(
                  item.amount
                )}
              </td>

            </tr>

          `;

        });


      html += `

        <tr class="subtotal-row">

          <td>
            ${escapeHtml(
              group.category
            )} 小計
          </td>

          <td></td>

          <td></td>

          <td class="money">
            $${money(
              group.subtotal
            )}
          </td>

        </tr>

      `;

    });



  if (
    !hasData
  ) {

    html = `

      <tr>

        <td
          colspan="4"
          class="no-data"
        >
          尚無請款資料
        </td>

      </tr>

    `;

  }

  else {

    html += `

      <tr class="total-row">

        <td>
          請款合計
        </td>

        <td></td>

        <td></td>

        <td class="money">
          $${money(
            data.claim.total
          )}
        </td>

      </tr>

    `;

  }


  tbody.innerHTML =
    html;

}

function showLoading() {


  document
    .getElementById(
      'result'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'loading'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'topError'
    )
    .textContent = '';

}



/* ===============================
   Error
================================ */

function showError(
  message
) {


  document
    .getElementById(
      'loading'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'result'
    )
    .classList
    .add(
      'hidden'
    );


  showTopError(
    message
  );

}



function showTopError(
  message
) {

  document
    .getElementById(
      'topError'
    )
    .textContent =
      message;

}



/* ===============================
   金額格式
================================ */

function money(
  value
) {

  return Number(
    value || 0
  ).toLocaleString(
    'zh-TW'
  );

}



/* ===============================
   HTML 安全
================================ */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
